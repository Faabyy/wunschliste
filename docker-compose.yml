services:
  wunschliste:
    build: .
    image: wunschliste:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Werte stehen in .env (Vorlage: .env.example), nicht hier.
      WUNSCHLISTE_CODE: ${WUNSCHLISTE_CODE:-}
      WUNSCHLISTE_ADMIN_PASSWORT: ${WUNSCHLISTE_ADMIN_PASSWORT:-}
      WUNSCHLISTE_HTTPS: ${WUNSCHLISTE_HTTPS:-0}
      WUNSCHLISTE_PREISABRUF: ${WUNSCHLISTE_PREISABRUF:-1}
    volumes:
      - wunschliste-data:/var/www/html/data

volumes:
  wunschliste-data:
